<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Toise</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <style>
      /* Same "old map" palette as the landing page. */
      :root {
        --bg: #faf7f2;
        --ink: #1a1a1a;
        --muted: #6b6259;
        --accent: #b8593d;
        --accent-dark: #9c4631;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 17px;
        line-height: 1.65;
        text-align: center;
        padding: 24px;
      }

      .box {
        max-width: 420px;
      }

      .code {
        font-size: 3rem;
        font-weight: 800;
        letter-spacing: -0.01em;
        margin: 0 0 8px;
      }

      h1 {
        font-size: 1.25rem;
        font-weight: 700;
        margin: 0 0 16px;
      }

      p {
        color: var(--muted);
        margin: 0 0 28px;
      }

      .btn {
        display: inline-block;
        padding: 12px 22px;
        border-radius: 6px;
        font-size: 1rem;
        font-weight: 600;
        text-decoration: none;
        background: var(--accent);
        color: var(--bg);
        border: 1px solid var(--accent);
        transition: background-color 0.18s ease;
      }

      .btn:hover {
        background: var(--accent-dark);
        border-color: var(--accent-dark);
      }

      a.plain {
        color: var(--accent);
      }
    </style>
  </head>

  <body>
    <div class="box">
      <p class="code">404</p>
      <h1>Page not found.</h1>
      <p>
        Head back to the home page or check the project on
        <a class="plain" href="https://github.com/toise-dev/toise">GitHub</a>.
      </p>
      <a class="btn" href="/">Back to home</a>
    </div>
  </body>
</html>
