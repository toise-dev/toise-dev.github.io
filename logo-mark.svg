    <rect x="14" y="16" width="36" height="7" rx="2.5"/>
    <rect x="28.5" y="16" width="7" height="26" rx="2.5"/>
  </g>
  <circle cx="32" cy="46" r="4.5" fill="#B8593D"/>
</svg>
