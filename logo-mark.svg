<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Toise">
  <!-- Toise mark: a bold two-tone "T" — anthracite bar over a terracotta
       stem (the measuring rod). Transparent background; use on any surface. -->
  <rect x="12" y="16" width="40" height="9" rx="3" fill="#1A1A1A"/>
  <rect x="26" y="16" width="12" height="34" rx="3" fill="#B8593D"/>
</svg>
