<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Toise">
  <!-- Toise mark: a bold "T" surveyor's mark resting on a terracotta
       benchmark point. Transparent background; use on any surface. -->
